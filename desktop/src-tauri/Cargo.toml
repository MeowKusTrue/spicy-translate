[package]
name = "spicy-translate"
version = "1.0.0"
description = "Spicy Translate — синхронный перевод для Spicy Lyrics"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"
